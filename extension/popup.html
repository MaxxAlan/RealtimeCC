<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RealtimeCC Bridge</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #f4f4f5;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .badge.connected {
      background: #22c55e;
    }
    label {
      display: block;
      font-size: 11px;
      color: #a1a1aa;
      margin-top: 8px;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 6px 10px;
      color: #fafafa;
      font-size: 13px;
      outline: none;
    }
    input:focus {
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover {
      background: #1d4ed8;
    }
    .status-text {
      margin-top: 10px;
      font-size: 12px;
      color: #71717a;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2><span id="dot" class="badge"></span> RealtimeCC Bridge</h2>
  
  <label for="port">WebSocket Port</label>
  <input type="number" id="port" value="9876" min="1024" max="65535">

  <label for="token">Pairing Token</label>
  <input type="text" id="token" placeholder="Paste token from app">

  <button id="saveBtn">Save & Connect</button>
  <div id="statusText" class="status-text">Disconnected</div>

  <script src="popup.js"></script>
</body>
</html>
